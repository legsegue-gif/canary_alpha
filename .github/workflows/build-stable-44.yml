name: Flutter Multi-Platform Build Stable 3.44

env:
  FLUTTER_VERSION: '3.44.1'  # 当前 stable 3.44.1 / Dart 3.12.1

on:
  # 被 release.yml 调用（tag 推送触发的 CD）。
  # 入参与下面的 workflow_dispatch 逐项一致 —— 两个入口共用同一套 inputs 上下文，
  # 所以 job 里一律写 inputs.X，不能写 github.event.inputs.X（那个只在 dispatch 下有值）。
  workflow_call:
    inputs:
      build_android: { type: boolean, required: false, default: true }
      build_ios:     { type: boolean, required: false, default: true }
      build_mac:     { type: boolean, required: false, default: true }
      build_windows: { type: boolean, required: false, default: true }
      build_linux:   { type: boolean, required: false, default: true }
      publish_release: { type: boolean, required: false, default: false }
      release_tag:     { type: string,  required: false, default: '' }
      prerelease:      { type: boolean, required: false, default: false }

  # 手动触发
  workflow_dispatch:
    inputs:
      # 选择构建的平台
      build_android:
        description: '构建 Android'
        required: false
        default: true
        type: boolean

      build_ios:
        description: '构建 iOS'
        required: false
        default: true
        type: boolean

      build_mac:
        description: '构建 macOS'
        required: false
        default: true
        type: boolean

      build_windows:
        description: '构建 Windows'
        required: false
        default: true
        type: boolean

      build_linux:
        description: '构建 Linux'
        required: false
        default: true
        type: boolean

      # 是否发布到 Release（默认不发布）
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean

      # Release 标签（只有选择发布时才需要填写）
      release_tag:
        description: 'Release 标签（如 v1.0.0）'
        required: false
        default: ''
        type: string

      # 是否为预发布版本
      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean

jobs:
  # Android 构建
  android:
    if: ${{ inputs.build_android }}
    name: 构建 Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            # 发布时以 release tag 为准（去掉前导 v）。否则 -canary.1 与 -canary.2
            # 会产出同名文件（都叫 1.1.17+61），下载到本地分不清是哪个。
            # tag 与 pubspec 的一致性由 release.yml 的 verify job 事先断言。
            VERSION="${{ inputs.release_tag }}"; VERSION="${VERSION#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"
      # 如果有签名密钥，写入密钥文件
      - name: 🔑 写入签名密钥
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ 签名配置已写入"
      - name: 🏗️ 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 📦 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Canary_android_${VERSION}_${abi}.apk"
          done
      - name: 🚀 发布到 Release
        if: ${{ inputs.publish_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: build/app/outputs/flutter-apk/Canary_android_*.apk

      - name: 📤 上传构建产物 (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Android-arm64-v8a
          path: build/app/outputs/flutter-apk/Canary_android_*_arm64-v8a.apk

      - name: 📤 上传构建产物 (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/Canary_android_*_armeabi-v7a.apk

      - name: 📤 上传构建产物 (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Android-x86_64
          path: build/app/outputs/flutter-apk/Canary_android_*_x86_64.apk

  # iOS 构建
  ios:
    if: ${{ inputs.build_ios }}
    name: 构建 iOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 🔧 关闭 Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            # 发布时以 release tag 为准（去掉前导 v）。否则 -canary.1 与 -canary.2
            # 会产出同名文件（都叫 1.1.17+61），下载到本地分不清是哪个。
            # tag 与 pubspec 的一致性由 release.yml 的 verify job 事先断言。
            VERSION="${{ inputs.release_tag }}"; VERSION="${VERSION#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"
      - name: 🏗️ 构建 iOS (无签名)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../Canary_ios_${VERSION}.ipa Payload
      - name: 🚀 发布到 Release
        if: ${{ inputs.publish_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: Canary_ios_*.ipa

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: iOS-IPA
          path: Canary_ios_*.ipa

  # macOS 构建
  macos:
    if: ${{ inputs.build_mac }}
    name: 构建 macOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 🔧 关闭 Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            # 发布时以 release tag 为准（去掉前导 v）。否则 -canary.1 与 -canary.2
            # 会产出同名文件（都叫 1.1.17+61），下载到本地分不清是哪个。
            # tag 与 pubspec 的一致性由 release.yml 的 verify job 事先断言。
            VERSION="${{ inputs.release_tag }}"; VERSION="${VERSION#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # 有证书就导入到一次性钥匙串；没配 secret 则整段跳过，构建照常绿，
      # 只是产出 ad-hoc 签名的未公证版本（用户需要 xattr -dr com.apple.quarantine）。
      # 条件写法沿用仓库既有模式：step 级 env: + if: ${{ env.X != '' }}。
      - name: 🔐 导入签名证书
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/canary-signing.keychain-db"
          KEYCHAIN_PW=$(openssl rand -base64 24)

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # 少了这一步，codesign 访问私钥时会弹交互式授权框，
          # 在无人值守的 CI 上表现为卡死直到超时，日志里看不出原因。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                       | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "❌ 钥匙串里找不到 Developer ID Application 证书"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "✅ 已导入：$IDENTITY"

      - name: 🏗️ 构建 macOS
        run: flutter build macos --release

      # --options runtime 就是 Hardened Runtime，公证的硬性要求。
      # ⚠️ 顺序必须先内层框架后外层 bundle：反过来的话，签完外层再动内层，
      #    外层签名直接失效。
      - name: 🔏 签名 App
        if: ${{ env.SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Canary.app"

          find "$APP/Contents/Frameworks" \
               \( -name "*.framework" -o -name "*.dylib" \) -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                codesign --force --timestamp --options runtime \
                  --sign "$SIGN_IDENTITY" "$f"
              done

          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_IDENTITY" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ 签名完成"

      # ── 第一轮公证：.app 本体 ────────────────────────────────────────────
      #
      # 为什么要单独公证一次 app，而不是只公证 DMG：
      #   票据是钉在**具体文件**上的。只钉 DMG 的话，用户挂载 DMG 时一切正常，
      #   但把 Canary.app 拖进 /Applications 之后，app 自身不带票据 ——
      #   首次启动时 Gatekeeper 找不到本地票据，会联网向 Apple 查询。
      #   联网时无感，离线首次启动就可能卡住或报「无法验证」。
      #   （首次实测确认过：xcrun stapler validate Canary.app 报
      #     "does not have a ticket stapled to it"。）
      #
      # ⚠️ 必须排在打 DMG **之前** —— 要让 DMG 里装的就是已装订好的 app。
      # 代价是多一次 notarytool 往返，整个 job 从约 9 分钟涨到约 14 分钟。
      - name: 🍎 公证 App 并装订
        if: ${{ env.SIGN_IDENTITY != '' && env.APPLE_API_KEY_P8 != '' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Canary.app"

          # notarytool 不收 .app 目录，必须先打包。
          # 用 ditto 而不是 zip：ditto 保留符号链接与扩展属性，
          # 普通 zip 会破坏 framework 里的符号链接结构，导致公证失败。
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Canary-app.zip"

          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$RUNNER_TEMP/Canary-app.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Canary-app.zip"

          # 票据钉回 .app 本体。装订不会破坏已有签名 —— Apple 就是这么设计的。
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          echo "✅ App 已公证并装订"

      - name: 📦 创建 DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Canary" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Canary_macos_${VERSION}.dmg" \
            "build/macos/Build/Products/Release/Canary.app" || true
          # 如果 create-dmg 失败，使用简单方式
          if [ ! -f "Canary_macos_${VERSION}.dmg" ]; then
            hdiutil create -volname Canary -srcfolder build/macos/Build/Products/Release/Canary.app -ov -format UDZO Canary_macos_${VERSION}.dmg
          fi

      # ── 第二轮公证：DMG 容器 ─────────────────────────────────────────────
      #
      # 光签名不够。签名只证明身份；公证是 Apple 扫过恶意代码；
      # 装订（stapler）是把票据钉进文件，让用户首次打开无需联网。
      # 三步缺一，用户就还得执行 xattr -dr com.apple.quarantine。
      #
      # 这一轮针对 DMG 容器本身。app 的票据已在上一步钉好，
      # 两轮都做完之后，「挂载 DMG」和「把 app 拖进 /Applications 后离线首启」
      # 两个场景才都不需要联网。
      - name: 🍎 公证 DMG 并装订
        if: ${{ env.SIGN_IDENTITY != '' && env.APPLE_API_KEY_P8 != '' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          DMG="Canary_macos_${VERSION}.dmg"

          # DMG 容器本身也要签，否则 Gatekeeper 会对容器报错
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"

          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "✅ 公证并装订完成"

      - name: 🚀 发布到 Release
        if: ${{ inputs.publish_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: Canary_macos_*.dmg

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: macOS-DMG
          path: Canary_macos_*.dmg

      # 一次性钥匙串用完即毁。always() 保证前面步骤失败时也会清理。
      - name: 🧹 清理钥匙串
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/canary-signing.keychain-db" 2>/dev/null || true

  # Windows 构建
  windows:
    if: ${{ inputs.build_windows }}
    name: 构建 Windows
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 安装最新 CMake
        uses: lukka/get-cmake@latest

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 🔧 获取依赖
        run: flutter pub get

      - name: 🔍 验证 CMake 版本
        shell: pwsh
        run: |
          Write-Host "检查 CMake 版本..."
          cmake --version
          $cmakeVersion = (cmake --version | Select-String "cmake version" | ForEach-Object { $_.ToString() })
          Write-Host "当前 CMake: $cmakeVersion"
      - name: 📝 获取版本号
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern "version:" | ForEach-Object { $_.Line.Split(":")[1].Trim() })
          if ("${{ inputs.publish_release }}" -ne "true") {
            $shortSha = git rev-parse --short HEAD
            $version = "$version`_$shortSha"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            # 与其余四个平台保持一致：发布时以 release tag 为准（去掉前导 v）。
            $version = "${{ inputs.release_tag }}" -replace '^v', ''
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "版本号: $version"
      - name: 🏗️ 构建 Windows
        run: flutter build windows --release

      - name: 📦 打包 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Canary_windows_$env:VERSION.zip"
      - name: 🔧 安装 Inno Setup
        run: choco install innosetup -y

      - name: 📦 创建安装程序
        shell: pwsh
        run: |
          # 语言文件检测（中文语言包在部分 Runner 缺失，避免编译失败）
          $zhLangCompiler = "C:\\Program Files (x86)\\Inno Setup 6\\Languages\\ChineseSimplified.isl"
          $zhLangLocalDir = Join-Path (Get-Location) "Languages"
          $zhLangLocal = Join-Path $zhLangLocalDir "ChineseSimplified.isl"
          $languagesBlock = $null
          if (Test-Path $zhLangCompiler) {
            Write-Host "✅ 检测到中文语言文件: $zhLangCompiler"
            $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          } else {
            Write-Host "⚠️ 未在 Inno Setup 安装目录找到中文语言文件，尝试下载到本地项目..."
            try {
              New-Item -ItemType Directory -Force -Path $zhLangLocalDir | Out-Null
              $uri = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
              Invoke-WebRequest -Uri $uri -OutFile $zhLangLocal -UseBasicParsing -TimeoutSec 60
              if (Test-Path $zhLangLocal) {
                Write-Host "✅ 已下载中文语言文件: $zhLangLocal"
                $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "$zhLangLocal"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
              }
            } catch {
              Write-Host "⚠️ 下载中文语言文件失败: $($_.Exception.Message)"
            }
            if (-not $languagesBlock) {
              Write-Host "ℹ️ 将仅包含英文安装向导"
              $languagesBlock = @"
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
            }
          }
          # 创建 Inno Setup 脚本
          $issContent = @"
          #define MyAppName "Canary"
          #define MyAppVersion "$env:VERSION"
          #define MyAppPublisher "Canary"
          #define MyAppExeName "canary.exe"
          [Setup]
          AppId={{A7B8C9D0-E1F2-4A5B-8C9D-0E1F2A3B4C5D}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=.
          OutputBaseFilename=Canary_windows_{#MyAppVersion}_setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          UninstallDisplayIcon={app}\{#MyAppExeName}
          $languagesBlock
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加图标:"
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\卸载 {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "启动 {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@
          
          # 使用 UTF-8 BOM 以确保中文字符在 Inno Setup 中正确解析
          $issContent | Out-File -FilePath "installer.iss" -Encoding utf8BOM
          
          # 编译安装程序
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
      - name: 🚀 发布到 Release
        if: ${{ inputs.publish_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            Canary_windows_*.zip
            Canary_windows_*_setup.exe
      - name: 📤 上传构建产物 (ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: Windows-ZIP
          path: Canary_windows_*.zip

      - name: 📤 上传构建产物 (Installer)
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Installer
          path: Canary_windows_*_setup.exe

  # Linux 构建
  linux:
    if: ${{ inputs.build_linux }}
    name: 构建 Linux
    runs-on: ubuntu-22.04
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev libunwind-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            rpm patchelf libfuse2 file \
            libkeybinder-3.0-dev libayatana-appindicator3-dev
      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        run: |
          RAW_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$RAW_VERSION
          if [ "${{ inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            # 与其余四个平台一致：产物文件名用 release tag（去掉前导 v）。
            VERSION="${{ inputs.release_tag }}"; VERSION="${VERSION#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # ⚠️ VERSION_NUMBER 单独派生，**必须保持纯数字**（1.1.17）。
          #    它进的是 deb 的 Version: 字段与 rpm 的 %define version，
          #    dpkg/rpm 对版本串格式有硬性要求，塞 1.1.17-canary.2 会打包失败。
          #    所以这里只取 pubspec 的数字段，不跟着 release tag 走。
          echo "VERSION_NUMBER=$(echo $RAW_VERSION | cut -d'+' -f1)" >> $GITHUB_ENV
      - name: 🏗️ 构建 Linux
        run: flutter build linux --release

      - name: 📦 打包 tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../Canary_linux_${VERSION}.tar.gz .
      - name: 📦 创建 AppImage
        run: |
          # 下载 appimagetool
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          
          # 创建 AppDir 结构
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          # 创建 AppRun 脚本
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/canary" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # 创建 desktop 文件
          cat > AppDir/canary.desktop << EOF
          [Desktop Entry]
          Name=Canary
          Exec=canary
          Icon=canary
          Type=Application
          Categories=Utility;
          EOF
          
          ICON_SOURCE="linux/canary.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" AppDir/canary.png
          install -Dm644 "$ICON_SOURCE" "AppDir/usr/share/icons/hicolor/256x256/apps/canary.png"
          
          # 构建 AppImage
          ARCH=x86_64 ./appimagetool AppDir Canary_linux_${VERSION}.AppImage
      - name: 📦 创建 DEB 包
        run: |
          # 创建 DEB 目录结构
          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/canary
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps
          
          # 复制文件
          cp -r build/linux/x64/release/bundle/* deb/opt/canary/
          
          # 创建 /usr/bin 软链接
          mkdir -p deb/usr/bin
          ln -s /opt/canary/canary deb/usr/bin/canary
          
          # 创建 control 文件
          cat > deb/DEBIAN/control << EOF
          Package: canary
          Version: ${VERSION_NUMBER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Canary <noreply@canary.app>
          Depends: libgtk-3-0, libstdc++6, libglu1-mesa, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, libglib2.0-0, libc6
          Description: Canary Application
           A Flutter application for Linux
          EOF
          
          # 创建 desktop 文件
          cat > deb/usr/share/applications/canary.desktop << EOF
          [Desktop Entry]
          Name=Canary
          Exec=/opt/canary/canary
          Icon=canary
          Type=Application
          Categories=Utility;
          EOF

          ICON_SOURCE="linux/canary.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" deb/usr/share/icons/hicolor/256x256/apps/canary.png
          
          # 创建启动脚本
          cat > deb/opt/canary/canary.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./canary "$@"
          EOF
          chmod +x deb/opt/canary/canary.sh
          
          # 构建 DEB 包
          dpkg-deb --build deb Canary_linux_${VERSION}_amd64.deb
      - name: 📦 创建 RPM 包
        run: |
          # 创建 RPM 构建目录
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # 创建源码目录
          mkdir -p canary-${VERSION_NUMBER}
          cp -r build/linux/x64/release/bundle/* canary-${VERSION_NUMBER}/
          ICON_SOURCE="linux/canary.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          cp "$ICON_SOURCE" canary-${VERSION_NUMBER}/canary.png
          tar -czf ~/rpmbuild/SOURCES/canary-${VERSION_NUMBER}.tar.gz canary-${VERSION_NUMBER}
          
          # 创建 spec 文件
          cat > ~/rpmbuild/SPECS/canary.spec << EOF
          Name:           canary
          Version:        ${VERSION_NUMBER}
          Release:        1%{?dist}
          Summary:        Canary Application
          License:        MIT
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      x86_64
          Requires:       gtk3, libstdc++ >= 6, mesa-libGLU, gstreamer1, gstreamer1-plugins-base, glib2, glibc
          
          %description
          A Flutter application for Linux
          
          %prep
          %setup -q
          
          %install
          mkdir -p %{buildroot}/opt/canary
          cp -r * %{buildroot}/opt/canary/
          
          mkdir -p %{buildroot}/usr/bin
          ln -s /opt/canary/canary %{buildroot}/usr/bin/canary
          
          mkdir -p %{buildroot}/usr/share/applications
          cat > %{buildroot}/usr/share/applications/canary.desktop << 'DESKTOPEOF'
          [Desktop Entry]
          Name=Canary
          Exec=/opt/canary/canary
          Icon=canary
          Type=Application
          Categories=Utility;
          DESKTOPEOF

          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp canary.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/canary.png
          
          %files
          /opt/canary/*
          /usr/bin/canary
          /usr/share/applications/canary.desktop
          /usr/share/icons/hicolor/256x256/apps/canary.png
          
          %changelog
          * $(date "+%a %b %d %Y") Canary <noreply@canary.app> - ${VERSION_NUMBER}-1
          - Initial RPM release
          EOF
          
          # 构建 RPM
          rpmbuild -bb ~/rpmbuild/SPECS/canary.spec
          cp ~/rpmbuild/RPMS/x86_64/canary-${VERSION_NUMBER}-1.*.rpm Canary_linux_${VERSION}.rpm
      - name: 🔍 RPM 元数据（调试）
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Canary_linux_${VERSION}.rpm"
          echo "RPM file: ${RPM_FILE}"
          cp -f ~/rpmbuild/SPECS/canary.spec rpm-spec.spec
          rpm -qp --info "${RPM_FILE}" | tee rpm-info.txt
          rpm -qp --requires "${RPM_FILE}" | tee rpm-requires.txt
          rpm -qp --provides "${RPM_FILE}" | tee rpm-provides.txt
      - name: 📤 上传 RPM 元数据（调试）
        uses: actions/upload-artifact@v7
        with:
          name: Linux-RPM-Metadata
          path: |
            rpm-spec.spec
            rpm-info.txt
            rpm-requires.txt
            rpm-provides.txt
      - name: 🧪 Fedora 43 安装测试
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Canary_linux_${VERSION}.rpm"
          docker run --rm -v "${PWD}:/work" -w /work fedora:43 bash -lc "dnf -y install ./${RPM_FILE}"
      - name: 🚀 发布到 Release
        if: ${{ inputs.publish_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            Canary_linux_*.tar.gz
            Canary_linux_*.AppImage
            Canary_linux_*_amd64.deb
            Canary_linux_*.rpm
      - name: 📤 上传构建产物 (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: Linux-tar.gz
          path: Canary_linux_*.tar.gz

      - name: 📤 上传构建产物 (AppImage)
        uses: actions/upload-artifact@v7
        with:
          name: Linux-AppImage
          path: Canary_linux_*.AppImage

      - name: 📤 上传构建产物 (DEB)
        uses: actions/upload-artifact@v7
        with:
          name: Linux-DEB
          path: Canary_linux_*_amd64.deb

      - name: 📤 上传构建产物 (RPM)
        uses: actions/upload-artifact@v7
        with:
          name: Linux-RPM
          path: Canary_linux_*.rpm